name: CI/CD — API Gateway

on:
  push:
    branches: [feature/api-gateway-monitor]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --coverage

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/api-gateway-monitor'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.staging -t api-gateway:staging .
      - run: docker save api-gateway:staging > gateway.tar