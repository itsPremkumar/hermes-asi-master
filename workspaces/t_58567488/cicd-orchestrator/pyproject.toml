[project]
name = "cicd-orchestrator"
version = "1.0.0"
description = "CI/CD Pipeline Automation & Blue-Green Deployment Orchestrator"
requires-python = ">=3.11"
dependencies = [
    "kubernetes>=28.1.0",
    "hvac>=1.2.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
cicd-orchestrator = "orchestrator.deploy_orchestrator:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]