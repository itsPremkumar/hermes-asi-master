apiVersion: v1
kind: Namespace
metadata:
  name: cicd-system
  labels:
    app.kubernetes.io/managed-by: cicd-orchestrator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cicd-orchestrator-sa
  namespace: cicd-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cicd-orchestrator-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "pods", "pods/log", "events"]
    verbs: ["get", "list", "create", "update", "patch", "delete", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cicd-orchestrator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cicd-orchestrator-role
subjects:
  - kind: ServiceAccount
    name: cicd-orchestrator-sa
    namespace: cicd-system