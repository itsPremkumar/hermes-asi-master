apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-orchestrator-blue
  namespace: default
  labels:
    app: cicd-orchestrator
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-orchestrator
      version: blue
  template:
    metadata:
      labels:
        app: cicd-orchestrator
        version: blue
    spec:
      serviceAccountName: cicd-orchestrator-sa
      containers:
        - name: orchestrator
          image: ghcr.io/itsPremkumar/cicd-orchestrator:latest
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          envFrom:
            - secretRef:
                name: cicd-secrets
---
