apiVersion: v1
kind: Service
metadata:
  name: cicd-orchestrator-service
  namespace: default
  labels:
    app: cicd-orchestrator
spec:
  selector:
    app: cicd-orchestrator
    version: blue
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cicd-config
  namespace: default
data:
  APP_NAME: "cicd-orchestrator"
  HEALTH_PATH: "/healthz"
  ROLLOUT_DELAY: "10"