# agents/curator/agent.yaml

name: curator
role: Memory Agent
priority: medium
description: Knowledge management and context curation

capabilities:
  - knowledge_organization
  - information_pruning
  - context_maintenance
  - cross_agent_sharing

inputs:
  - knowledge_artifacts
  - context_requests

outputs:
  - curated_context
  - relevance_scores
  - retrieval_results

resources:
  cpu: "0.5"
  memory: "1Gi"

scaling:
  min: 1
  max: 3
