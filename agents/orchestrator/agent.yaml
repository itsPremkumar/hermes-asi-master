# agents/orchestrator/agent.yaml

name: orchestrator
role: Master Orchestrator
priority: critical
description: Central decision engine and task router

capabilities:
  - goal_decomposition
  - task_assignment
  - progress_monitoring
  - escalation_handling
  - state_management

inputs:
  - goal_specifications
  - user_commands
  - system_events

outputs:
  - execution_plans
  - status_reports
  - completion_events

resources:
  cpu: "2"
  memory: "4Gi"

scaling:
  min: 1
  max: 3
